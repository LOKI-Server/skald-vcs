[workspace]
members = ["crates/core", "crates/ffi", "crates/cli", "crates/xtask"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LOKI-Server/skald-vcs"
homepage = "https://github.com/LOKI-Server/skald-vcs"
readme = "README.md"

[workspace.dependencies]
skald-vcs-core = { path = "crates/core", version = "0.2.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
